app = "museum-on-screen"
primary_region = "nrt"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 3_000
min_machines_running = 0

[http_service.concurrency]
soft_limit = 200
type = "requests"

[[vm]]
cpus = 1
memory = "1gb"
memory_mb = 1_024
size = "shared-cpu-1x"
