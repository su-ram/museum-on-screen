<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serif &amp; Slab fonts — Museum on Screen</title>
<style>
:root{--bg:#fbfaf7;--ink:#161616;--muted:#6b6a64;--line:#e8e5dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Pretendard Variable",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(251,250,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
header h1{font-size:15px;margin:0;font-weight:600}
label{display:flex;align-items:center;gap:8px;color:var(--muted)}
input[type=text]{height:34px;border:1px solid var(--line);background:transparent;padding:0 10px;font:inherit;color:var(--ink);min-width:220px}
input[type=range]{width:140px}
select,button{height:34px;border:1px solid var(--line);background:transparent;font:inherit;color:var(--ink);padding:0 10px;cursor:pointer}
.count{color:var(--muted);margin-left:auto}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0;padding:0 20px 80px}
.card{padding:28px 8px 18px;border-bottom:1px solid var(--line);cursor:pointer;min-height:130px}
.card:hover{background:rgba(0,0,0,.025)}
.sample{line-height:1.1;overflow-wrap:anywhere;min-height:1.2em}
.meta{margin-top:12px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.tag{border:1px solid var(--line);padding:0 6px;font-size:11px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>

const grid=document.getElementById('grid'),$=id=>document.getElementById(id);
const loaded=new Set();
function css(chunk){const u='https://fonts.googleapis.com/css2?'+chunk.map(f=>'family='+encodeURIComponent(f.f).replace(/%20/g,'+')+':wght@'+f.w).join('&')+'&display=swap';const l=document.createElement('link');l.rel='stylesheet';l.href=u;document.head.appendChild(l);}
// Lazy-load fonts for the cards near the viewport, in small batches.
let pending=[];let timer=null;
const io=new IntersectionObserver(es=>{for(const e of es){if(!e.isIntersecting)continue;io.unobserve(e.target);const f=e.target._f;if(!loaded.has(f.f)){loaded.add(f.f);pending.push(f);}}
 if(pending.length&&!timer)timer=setTimeout(()=>{while(pending.length)css(pending.splice(0,16));timer=null;},80);},{rootMargin:'600px'});
function render(){
 const q=$('q').value.trim().toLowerCase(),kind=$('kind').value,sort=$('sort').value;
 let list=FONTS.filter(f=>(!kind||f.s===kind)&&(!q||f.f.toLowerCase().includes(q)));
 if(sort==='az')list=[...list].sort((a,b)=>a.f.localeCompare(b.f));
 grid.innerHTML='';
 for(const f of list){const c=document.createElement('div');c.className='card';c._f=f;
  c.innerHTML='<div class="sample" style="font-family:\''+f.f+'\',serif;font-size:'+$('size').value+'px;font-weight:'+f.w+'"></div><div class="meta"><b style="color:var(--ink);font-weight:500">'+f.f+'</b><span class="tag">'+f.s+'</span></div>';
  c.firstChild.textContent=$('text').value;
  c.onclick=()=>{navigator.clipboard?.writeText(f.f);const t=$('toast');t.textContent='복사됨: '+f.f;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200);};
  grid.appendChild(c);io.observe(c);}
 $('count').textContent=list.length+'개 폰트';
}
$('text').oninput=()=>document.querySelectorAll('.sample').forEach(s=>s.textContent=$('text').value);
$('size').oninput=()=>{$('sizeV').textContent=$('size').value+'px';document.querySelectorAll('.sample').forEach(s=>s.style.fontSize=$('size').value+'px');};
$('q').oninput=$('kind').onchange=$('sort').onchange=render;
render();
